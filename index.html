<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2a7fff;
            --primary-hover: #1a66e5;
            --bg-color: #f4f7fc;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --success-color: #2ecc71;
            --border-radius: 14px;
            --shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 14px;
            line-height: 1.5;
        }

        /* Slight Zoom-Out on Desktop to fit screen without scrolling */
        @media (min-width: 901px) {
            body {
                zoom: 0.88;
            }
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0 6px;
        }

        /* Compact Header Area */
        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 14px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sync-badge {
            font-size: 0.78rem;
            background: rgba(255, 255, 255, 0.18);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f39c12;
        }
        .sync-dot.online { background: #2ecc71; }
        .sync-dot.offline { background: #e74c3c; }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.18);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.86rem;
            font-weight: 600;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header:hover {
            background: white;
            color: var(--primary-color);
        }

        .btn-header.active-tab {
            background: #f39c12;
            border-color: #e67e22;
            color: white;
        }

        .btn-upload {
            background: #3182ce;
            border-color: #63b3ed;
        }

        .btn-shopping {
            background: #2ecc71;
            border-color: #27ae60;
        }

        .btn-shopping:hover {
            background: #27ae60;
            color: white;
        }

        /* Main Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 335px 1fr;
            gap: 16px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1.08rem;
            margin-bottom: 12px;
            color: #1e3c72;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f0f3f8;
            padding-bottom: 6px;
        }

        /* Accordion */
        .visit-accordion {
            background: #f8fafc;
            border-radius: 10px;
            border: 1px dashed #cbd5e0;
            margin-top: 14px;
            overflow: hidden;
        }

        .visit-accordion-header {
            padding: 8px 12px;
            background: #edf2f7;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #1e3c72;
        }

        .visit-accordion-body { padding: 10px; display: none; }
        .visit-accordion-body.open { display: block; }

        .btn-add-visit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 3px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .visit-item-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 6px;
        }

        .visit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            font-size: 0.82rem;
        }

        .btn-del-visit {
            color: var(--danger-color);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
        }

        /* Form Styles */
        .form-group { margin-bottom: 11px; }
        .form-group label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #4a5568;
        }

        .form-control {
            width: 100%;
            padding: 7px 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 9px;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.25s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(42, 127, 255, 0.15);
        }

        .freq-options { display: flex; gap: 14px; margin-bottom: 8px; }
        .freq-options label {
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dose-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #f8fafc;
            padding: 7px;
            border-radius: 9px;
            border: 1px dashed #cbd5e0;
        }

        .dose-item { text-align: center; }
        .dose-item span {
            display: block;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .dose-select {
            width: 100%;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-weight: 600;
            text-align: center;
        }

        .week-days-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: #f8fafc;
            padding: 7px;
            border-radius: 9px;
            border: 1px dashed #cbd5e0;
        }

        .day-checkbox {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
        }

        .duration-presets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }

        .preset-btn {
            padding: 5px 2px;
            background: #edf2f7;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .preset-btn:hover, .preset-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        #customDaysBox { display: none; margin-top: 5px; }

        .dose-change-box {
            background: #fffdf5;
            border: 1px solid #f6e05e;
            padding: 8px;
            border-radius: 9px;
            margin-top: 6px;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 9px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.3s;
        }

        .btn-submit:hover { background: var(--primary-hover); }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
            min-width: 200px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input { padding-left: 36px; }

        .filter-btn {
            background: var(--card-bg);
            border: 1.5px solid #e2e8f0;
            padding: 7px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.25s;
        }

        .filter-btn.active {
            background: #fff5f5;
            color: var(--danger-color);
            border-color: #feb2b2;
        }

        /* Medicine Cards Grid */
        .medicine-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .med-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            position: relative;
            border-left: 5px solid var(--primary-color);
            transition: all 0.2s ease;
        }

        .med-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -5px rgba(0,0,0,0.08);
        }

        .med-card.low-stock {
            border-left-color: var(--danger-color);
            background: #fffafa;
        }

        /* Archive Mode Styling */
        .med-card.archive-running {
            border: 2px solid #38b2ac;
            border-left: 6px solid #38b2ac;
            background: linear-gradient(to bottom right, #ffffff, #f0fff4);
        }

        .med-card.archive-inactive {
            background: #edf2f7;
            border-left: 5px solid #a0aec0;
            opacity: 0.68;
            filter: grayscale(85%);
        }

        .med-card.archive-inactive:hover {
            opacity: 0.9;
        }

        .status-tag {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            margin-bottom: 5px;
            display: inline-block;
        }
        .tag-running { background: #c6f6d5; color: #22543d; }
        .tag-stopped { background: #cbd5e0; color: #2d3748; }

        .med-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 8px;
        }

        .med-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .prescription-badge {
            font-size: 0.8rem;
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 8px;
            border-radius: 7px;
            font-weight: 700;
            border: 1px solid #c7d2fe;
            white-space: nowrap;
        }

        .med-dates {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            background: #f8fafc;
            padding: 5px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }

        .med-stats {
            margin: 6px 0;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 9px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.83rem;
            margin-bottom: 4px;
        }

        .stat-row:last-child { margin-bottom: 0; }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 700; }

        .consumed-info {
            font-size: 0.74rem;
            color: #3182ce;
            background: #ebf8ff;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .days-badge {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 6px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            margin-top: 5px;
        }

        .badge-good { background: #e6fffa; color: #234e52; }
        .badge-warning { background: #fffaf0; color: #7b341e; }
        .badge-danger { background: #fff5f5; color: #9b2c2c; }
        .badge-archived { background: #e2e8f0; color: #4a5568; }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #f0f3f8;
        }

        .btn-icon {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 4px 9px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .btn-icon:hover { color: var(--primary-color); border-color: var(--primary-color); }
        .btn-icon.remove:hover { color: var(--danger-color); border-color: var(--danger-color); background: #fff5f5; }
        .btn-icon.restore:hover { color: var(--success-color); border-color: var(--success-color); background: #f0fff4; }

        .empty-state {
            text-align: center;
            padding: 35px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal {
            background: white;
            border-radius: var(--border-radius);
            padding: 22px;
            max-width: 620px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #f0f3f8;
            padding-bottom: 8px;
        }

        .shopping-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .shopping-table th, .shopping-table td {
            padding: 8px 10px;
            border: 1px solid #e2e8f0;
            text-align: left;
            font-size: 0.88rem;
        }

        .shopping-table th { background: #f8fafc; color: #1e3c72; }

        @media print {
            .main-grid { display: block; }
            .sidebar, .controls, .card-actions, .header-actions { display: none !important; }
            body { background: white; padding: 0; zoom: 1; }
            .med-card { box-shadow: none; border: 1px solid #ccc; margin-bottom: 12px; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>
                <i class="fa-solid fa-prescription-bottle-medical"></i> ওষুধ ট্র্যাকার
                <span class="sync-badge" id="syncStatusBadge">
                    <span class="sync-dot" id="syncDot"></span>
                    <span id="syncStatusText">কানেক্ট হচ্ছে...</span>
                </span>
            </h1>
        </div>
        <div class="header-actions">
            <button class="btn-header btn-upload" id="cloudSyncBtn" onclick="manualCloudUpload()">
                <i class="fa-solid fa-cloud-arrow-up"></i> আপডেট / আপলোড
            </button>
            <button class="btn-header" id="archiveHeaderBtn" onclick="toggleArchiveView()">
                <i class="fa-solid fa-box-archive"></i> আর্কাইভ (সব ওষুধ)
            </button>
            <button class="btn-header btn-shopping" onclick="openShoppingModal()">
                <i class="fa-solid fa-cart-shopping"></i> কেনার তালিকা
            </button>
        </div>
    </header>

    <div class="main-grid">
        <!-- Sidebar Area -->
        <div class="sidebar">
            <div class="card card-form">
                <h2><i class="fa-solid fa-plus-circle"></i> ওষুধ তথ্য ইনপুট</h2>
                <form id="medicineForm">
                    <input type="hidden" id="medId">
                    <div class="form-group">
                        <label for="medName">ওষুধের নাম</label>
                        <input type="text" id="medName" class="form-control" placeholder="যেমন: Deflazit 6mg" required>
                    </div>

                    <div class="form-group">
                        <label>সেবনের নিয়ম</label>
                        <div class="freq-options">
                            <label><input type="radio" name="freqType" value="daily" checked onclick="toggleFreqMode('daily')"> প্রতিদিন</label>
                            <label><input type="radio" name="freqType" value="weekly" onclick="toggleFreqMode('weekly')"> সপ্তাহে নির্দিষ্ট দিন</label>
                        </div>
                    </div>

                    <div class="form-group" id="dailyDoseBox">
                        <label>দৈনিক সেবনের মাত্রা (সকাল + দুপুর + রাত)</label>
                        <div class="dose-grid">
                            <div class="dose-item">
                                <span>সকাল</span>
                                <select id="doseMorning" class="dose-select">
                                    <option value="0">0</option>
                                    <option value="0.5">1/2</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                </select>
                            </div>
                            <div class="dose-item">
                                <span>দুপুর</span>
                                <select id="doseNoon" class="dose-select">
                                    <option value="0">0</option>
                                    <option value="0.5">1/2</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                </select>
                            </div>
                            <div class="dose-item">
                                <span>রাত</span>
                                <select id="doseNight" class="dose-select">
                                    <option value="0">0</option>
                                    <option value="0.5">1/2</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                </select>
                            </div>
                        </div>

                        <div style="margin-top: 6px;">
                            <label style="font-size: 0.78rem; font-weight:600; cursor:pointer;">
                                <input type="checkbox" id="hasDoseChange" onchange="toggleDoseChangeBox()"> ১ম মাসের পর কি ডোজ পরিবর্তন হবে?
                            </label>
                        </div>

                        <div id="doseChangeBox" class="dose-change-box" style="display:none;">
                            <label style="font-size:0.76rem; color:#744210; font-weight:700;">২য় মাস থেকে দৈনিক সেবনের মাত্রা:</label>
                            <div class="dose-grid" style="margin-top:4px; background:white;">
                                <div class="dose-item">
                                    <span>সকাল</span>
                                    <select id="nextDoseMorning" class="dose-select">
                                        <option value="0">0</option>
                                        <option value="0.5">1/2</option>
                                        <option value="1">1</option>
                                    </select>
                                </div>
                                <div class="dose-item">
                                    <span>দুপুর</span>
                                    <select id="nextDoseNoon" class="dose-select">
                                        <option value="0">0</option>
                                        <option value="0.5">1/2</option>
                                        <option value="1">1</option>
                                    </select>
                                </div>
                                <div class="dose-item">
                                    <span>রাত</span>
                                    <select id="nextDoseNight" class="dose-select">
                                        <option value="0">0</option>
                                        <option value="0.5">1/2</option>
                                        <option value="1">1</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" id="weeklyDoseBox" style="display: none;">
                        <label>সপ্তাহে কোন কোন দিন খাবেন?</label>
                        <div class="week-days-grid">
                            <label class="day-checkbox"><input type="checkbox" class="week-day-input" value="sat"> শনি</label>
                            <label class="day-checkbox"><input type="checkbox" class="week-day-input" value="sun"> রবি</label>
                            <label class="day-checkbox"><input type="checkbox" class="week-day-input" value="mon"> সোম</label>
                            <label class="day-checkbox"><input type="checkbox" class="week-day-input" value="tue"> মঙ্গল</label>
                            <label class="day-checkbox"><input type="checkbox" class="week-day-input" value="wed"> বুধ</label>
                            <label class="day-checkbox"><input type="checkbox" class="week-day-input" value="thu"> বৃহস্পতি</label>
                            <label class="day-checkbox"><input type="checkbox" class="week-day-input" value="fri"> শুক্র</label>
                        </div>
                        <div style="margin-top: 5px;">
                            <label for="weeklySingleDose">প্রতিবার কয়টি করে ট্যাবলেট?</label>
                            <input type="number" id="weeklySingleDose" class="form-control" step="0.5" value="1" min="0.5">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="currentStock">বর্তমানে ঘরে কয়টি আছে?</label>

    // =========================================================================
    // টাইম-বেজড অটো স্টক ক্যালকুলেশন ইঞ্জিন
    // সকাল: ১০:০০ পর্যন্ত | দুপুর: ১:০০ - ৩:০০ | রাত: ৭:০০ - ১১:০০
    // =========================================================================
    function getDoseForDate(med, targetDateObj) {
        const start = new Date(med.startDate + "T00:00:00");
        const dayDiff = Math.floor((targetDateObj - start) / (1000 * 60 * 60 * 24));
        if (med.hasDoseChange && dayDiff >= 30) {
            return med.nextDoses || { m: 0, n: 0, nt: 0 };
        }
        return med.doses || { m: 0, n: 0, nt: 0 };
    }

    function calculateLiveStock(med) {
        const baseStock = parseFloat(med.currentStock) || 0;
        if (!med.lastStockUpdated) return { liveStock: baseStock, consumedSinceUpdate: 0 };

        const updatedTime = new Date(med.lastStockUpdated);
        const now = new Date();

        if (now <= updatedTime) {
            return { liveStock: baseStock, consumedSinceUpdate: 0 };
        }

        let effectiveEndTime = now;
        if (!med.isContinuous) {
            const courseEnd = new Date(addDays(med.startDate, med.targetDays) + "T23:59:59");
            if (courseEnd < effectiveEndTime) effectiveEndTime = courseEnd;
        }

        if (effectiveEndTime <= updatedTime) {
            return { liveStock: baseStock, consumedSinceUpdate: 0 };
        }

        let consumed = 0;

        if (med.freqType === 'daily') {
            let cursor = new Date(updatedTime.getFullYear(), updatedTime.getMonth(), updatedTime.getDate());
            const endDay = new Date(effectiveEndTime.getFullYear(), effectiveEndTime.getMonth(), effectiveEndTime.getDate());

            const SLOT_HOURS = { m: 10, n: 13, nt: 19 };

            while (cursor <= endDay) {
                const dose = getDoseForDate(med, cursor);
                const mTime = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), SLOT_HOURS.m, 0, 0);
                const nTime = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), SLOT_HOURS.n, 0, 0);
                const ntTime = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), SLOT_HOURS.nt, 0, 0);

                if (mTime > updatedTime && mTime <= effectiveEndTime) consumed += (dose.m || 0);
                if (nTime > updatedTime && nTime <= effectiveEndTime) consumed += (dose.n || 0);
                if (ntTime > updatedTime && ntTime <= effectiveEndTime) consumed += (dose.nt || 0);

                cursor.setDate(cursor.getDate() + 1);
            }
        } else {
            const dayMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            let cursor = new Date(updatedTime.getFullYear(), updatedTime.getMonth(), updatedTime.getDate());
            const endDay = new Date(effectiveEndTime.getFullYear(), effectiveEndTime.getMonth(), effectiveEndTime.getDate());

            while (cursor <= endDay) {
                const dayCode = dayMap[cursor.getDay()];
                if (med.selectedWeekDays && med.selectedWeekDays.includes(dayCode)) {
                    const takeTime = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), 10, 0, 0);
                    if (takeTime > updatedTime && takeTime <= effectiveEndTime) {
                        consumed += (med.weeklySingleDose || 1);
                    }
                }
                cursor.setDate(cursor.getDate() + 1);
            }
        }

        const liveStock = Math.max(0, +(baseStock - consumed).toFixed(2));
        return { liveStock, consumedSinceUpdate: +consumed.toFixed(2) };
    }

    function isMedicineRunning(med) {
        if (med.isArchived) return false;
        if (med.isContinuous) return true;
        const todayStr = new Date().toISOString().split('T')[0];
        const endDateStr = addDays(med.startDate, med.targetDays);
        return endDateStr >= todayStr;
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'N/A';
        const d = new Date(dateStr);
        const months = ['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসেম্বর'];
        return `${toBengaliNumeral(d.getDate())} ${months[d.getMonth()]}, ${toBengaliNumeral(d.getFullYear())}`;
    }

    function addDays(dateStr, days) {
        const result = new Date(dateStr);
        result.setDate(result.getDate() + parseInt(days));
        return result.toISOString().split('T')[0];
    }

    function getRequiredForPeriod(med, fromDate, totalDays) {
        let total = 0;
        const start = new Date(med.startDate);
        const current = new Date(fromDate);

        for (let i = 0; i < totalDays; i++) {
            const dayDiff = Math.floor((current - start) / (1000 * 60 * 60 * 24));
            if (med.freqType === 'daily') {
                if (med.hasDoseChange && dayDiff >= 30) {
                    const d2 = med.nextDoses || { m: 0, n: 0, nt: 0 };
                    total += (d2.m + d2.n + d2.nt);
                } else {
                    const d1 = med.doses || { m: 0, n: 0, nt: 0 };
                    total += (d1.m + d1.n + d1.nt);
                }
            } else {
                total += med.dailyQty;
            }
            current.setDate(current.getDate() + 1);
        }
        return total;
    }

    function restoreFromArchive(id) {
        const med = appData.medicines.find(m => m.id === id);
        if (!med) return;
        med.isArchived = false;
        saveAppData(false);
        renderMedicines();
    }

    // Permanent delete (only inside Archive view)
    function permanentDeleteMedicine(id) {
        if (confirm('আর্কাইভ থেকে এই ওষুধটি স্থায়ীভাবে মুছে ফেলতে চান?')) {
            appData.medicines = appData.medicines.filter(m => m.id !== id);
            saveAppData(false);
            renderMedicines();
        }
    }

    function renderMedicines() {
        const query = searchInput.value.toLowerCase();
        container.innerHTML = '';

        let filtered = appData.medicines.filter(m => m.name.toLowerCase().includes(query));

        if (!isArchiveView) {
            filtered = filtered.filter(m => isMedicineRunning(m));
        } else {
            filtered.sort((a, b) => (isMedicineRunning(b) ? 1 : 0) - (isMedicineRunning(a) ? 1 : 0));
        }

        if (filterLowStock) {
            filtered = filtered.filter(m => {
                const { liveStock } = calculateLiveStock(m);
                return isMedicineRunning(m) && (liveStock / (m.dailyQty || 1)) <= 7;
            });
        }

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-pills" style="font-size:2.2rem; margin-bottom:8px; color:#cbd5e0;"></i>
                    <p>${isArchiveView ? 'আর্কাইভে কোনো ওষুধ পাওয়া যায়নি।' : 'বর্তমানে কোনো চলমান ওষুধ পাওয়া যায়নি।'}</p>
                </div>
            `;
            return;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const todayDate = new Date(todayStr);

        filtered.forEach(med => {
            const running = isMedicineRunning(med);
            const { liveStock, consumedSinceUpdate } = calculateLiveStock(med);
            const daysLeft = Math.floor(liveStock / (med.dailyQty || 1));

            let dosePattern = '';
            if (med.freqType === 'weekly') {
                dosePattern = `সপ্তাহে ${toBengaliNumeral(med.selectedWeekDays.length)} দিন (${formatDoseVal(med.weeklySingleDose)} টি)`;
            } else {
                dosePattern = `${formatDoseVal(med.doses.m)}+${formatDoseVal(med.doses.n)}+${formatDoseVal(med.doses.nt)}`;
                if (med.hasDoseChange) {
                    dosePattern += ` (২য় মাস: ${formatDoseVal(med.nextDoses.m)}+${formatDoseVal(med.nextDoses.n)}+${formatDoseVal(med.nextDoses.nt)})`;
                }
            }

            let doseLabelHtml = med.freqType === 'weekly'
                ? `<div class="stat-row"><span class="stat-label">সাপ্তাহিক সেবন:</span><span class="stat-value">${toBengaliNumeral(med.selectedWeekDays.length)} দিন (${formatDoseVal(med.weeklySingleDose)} টি)</span></div>`
                : `<div class="stat-row"><span class="stat-label">দৈনিক সেবন:</span><span class="stat-value">${toBengaliNumeral(med.doses.m + med.doses.n + med.doses.nt)} টি</span></div>`;

            let statRowHtml = '';
            let endDateText = '';

            if (med.isContinuous) {
                endDateText = 'চলবে (স্থায়ী)';
                const monthlyRequired = Math.ceil(getRequiredForPeriod(med, todayStr, 30));
                const now = new Date();
                const lastDayOfCurrMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                const remainingDaysInMonth = lastDayOfCurrMonth - now.getDate() + 1;
                const currentMonthRequired = Math.ceil(getRequiredForPeriod(med, todayStr, remainingDaysInMonth));
                const shortageCurrentMonth = currentMonthRequired - liveStock;

                const monthStatusText = shortageCurrentMonth > 0 ? `${toBengaliNumeral(shortageCurrentMonth.toFixed(1))} টি` : 'প্রয়োজন নেই';
                const monthStatusColor = shortageCurrentMonth > 0 ? 'var(--danger-color)' : 'var(--success-color)';

                statRowHtml = `
                    ${doseLabelHtml}
                    <div class="stat-row">
                        <span class="stat-label">বর্তমান স্টক:</span>
                        <span class="stat-value" style="color:#1e3c72;">${toBengaliNumeral(liveStock)} টি</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">১ মাসের (৩০ দিন) প্রয়োজন:</span>
                        <span class="stat-value">${toBengaliNumeral(monthlyRequired)} টি</span>
                    </div>
                    <div class="stat-row" style="color: ${monthStatusColor}">
                        <span class="stat-label" style="color: inherit; font-weight: 600;">চলতি মাসে (${toBengaliNumeral(remainingDaysInMonth)} দিন) কম পড়বে:</span>
                        <span class="stat-value">${monthStatusText}</span>
                    </div>
                `;
            } else {
                const endDateStr = addDays(med.startDate, med.targetDays);
                endDateText = formatDate(endDateStr);
                const endDateObj = new Date(endDateStr);
                const remainingDays = Math.max(0, Math.ceil((endDateObj - todayDate) / (1000 * 60 * 60 * 24)));
                const requiredForRemainingCourse = Math.ceil(getRequiredForPeriod(med, todayStr, remainingDays));

                if (liveStock >= requiredForRemainingCourse) {
                    const surplus = liveStock - requiredForRemainingCourse;
                    statRowHtml = `
                        ${doseLabelHtml}
                        <div class="stat-row">
                            <span class="stat-label">বর্তমান স্টক:</span>
                            <span class="stat-value" style="color:#1e3c72;">${toBengaliNumeral(liveStock)} টি</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">কোর্স শেষের বাকি:</span>
                            <span class="stat-value">${toBengaliNumeral(remainingDays)} দিন (${toBengaliNumeral(requiredForRemainingCourse)} টি)</span>
                        </div>
                        <div class="stat-row" style="color: var(--success-color)">
                            <span class="stat-label" style="color: inherit; font-weight: 600;">কোর্স শেষে অতিরিক্ত থাকবে:</span>
                            <span class="stat-value">${toBengaliNumeral(surplus.toFixed(1))} টি</span>
                        </div>
                    `;
                } else {
                    const shortage = requiredForRemainingCourse - liveStock;
                    statRowHtml = `
                        ${doseLabelHtml}
                        <div class="stat-row">
                            <span class="stat-label">বর্তমান স্টক:</span>
                            <span class="stat-value" style="color:#1e3c72;">${toBengaliNumeral(liveStock)} টি</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">কোর্স শেষের বাকি:</span>
                            <span class="stat-value">${toBengaliNumeral(remainingDays)} দিন (${toBengaliNumeral(requiredForRemainingCourse)} টি)</span>
                        </div>
                        <div class="stat-row" style="color: var(--danger-color)">
                            <span class="stat-label" style="color: inherit; font-weight: 600;">কোর্স সম্পূর্ণ করতে কম পড়বে:</span>
                            <span class="stat-value">${toBengaliNumeral(shortage.toFixed(1))} টি</span>
                        </div>
                    `;
                }
            }

            let badgeClass = 'badge-good';
            let statusText = `চলবে আর ${toBengaliNumeral(daysLeft)} দিন`;

            if (!running) {
                badgeClass = 'badge-archived';
                statusText = med.isArchived ? 'আর্কাইভ করা হয়েছে' : 'কোর্সের মেয়াদ শেষ';
            } else if (daysLeft <= 3) {
                badgeClass = 'badge-danger';
                statusText = `জরুরি! চলবে মাত্র ${toBengaliNumeral(daysLeft)} দিন`;
            } else if (daysLeft <= 7) {
                badgeClass = 'badge-warning';
                statusText = `স্টক কম! চলবে ${toBengaliNumeral(daysLeft)} দিন`;
            }

            let cardStateClass = '';
            if (isArchiveView) {
                cardStateClass = running ? 'archive-running' : 'archive-inactive';
            } else if (daysLeft <= 7) {
                cardStateClass = 'low-stock';
            }

            const archiveStatusBadge = isArchiveView
                ? `<span class="status-tag ${running ? 'tag-running' : 'tag-stopped'}">${running ? '● চলমান (Running)' : '○ বন্ধ / মেয়াদোত্তীর্ণ'}</span>`
                : '';

            const autoDeductNote = consumedSinceUpdate > 0
                ? `<div class="consumed-info"><span><i class="fa-solid fa-clock-rotate-left"></i> অটো বাদ গেছে:</span><strong>${toBengaliNumeral(consumedSinceUpdate)} টি</strong></div>`
                : '';

            // Action Buttons: In main view -> Edit + Remove (moves to archive); In archive view -> Restore/Permanent Delete
            let actionButtonsHtml = '';
            if (!isArchiveView) {
                actionButtonsHtml = `
                    <button class="btn-icon" onclick="editMedicine(${med.id})" title="সম্পাদনা করুন">
                        <i class="fa-solid fa-pen-to-square"></i> এডিট
                    </button>
                    <button class="btn-icon remove" onclick="moveToArchive(${med.id})" title="রিমুভ করে আর্কাইভে পাঠান">
                        <i class="fa-solid fa-trash-arrow-up"></i> রিমুভ
                    </button>
                `;
            } else {
                actionButtonsHtml = med.isArchived
                    ? `
                        <button class="btn-icon restore" onclick="restoreFromArchive(${med.id})" title="পুনরায় চালু করুন">
                            <i class="fa-solid fa-rotate-left"></i> ফিরিয়ে আনুন
                        </button>
                        <button class="btn-icon remove" onclick="permanentDeleteMedicine(${med.id})" title="স্থায়ীভাবে মুছুন">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                      `
                    : `
                        <button class="btn-icon" onclick="editMedicine(${med.id})">
                            <i class="fa-solid fa-pen-to-square"></i> এডিট
                        </button>
                        <button class="btn-icon remove" onclick="moveToArchive(${med.id})">
                            <i class="fa-solid fa-box-archive"></i> বন্ধ করুন
                        </button>
                      `;
            }

            const cardHtml = `
                <div class="med-card ${cardStateClass}">
                    ${archiveStatusBadge}
                    <div class="med-header">
                        <div class="med-title">${escapeHtml(med.name)}</div>
                        <div class="prescription-badge">${dosePattern}</div>
                    </div>

                    <div class="med-dates">
                        <span><i class="fa-regular fa-calendar-check"></i> শুরু: ${formatDate(med.startDate)}</span>
                        <span><i class="fa-regular fa-calendar"></i> শেষ: ${endDateText}</span>
                    </div>

                    ${autoDeductNote}

                    <div class="med-stats">
                        ${statRowHtml}
                    </div>

                    ${med.note ? `<div style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 5px;"><i class="fa-solid fa-info-circle"></i> ${escapeHtml(med.note)}</div>` : ''}

                    <div class="days-badge ${badgeClass}">
                        ${statusText}
                    </div>

                    <div class="card-actions">
                        ${actionButtonsHtml}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    function editMedicine(id) {
        const med = appData.medicines.find(m => m.id === id);
        if (!med) return;

        const { liveStock } = calculateLiveStock(med);

        document.getElementById('medId').value = med.id;
        document.getElementById('medName').value = med.name;
        
        if (med.freqType === 'weekly') {
            document.querySelector('input[name="freqType"][value="weekly"]').checked = true;
            toggleFreqMode('weekly');
            document.querySelectorAll('.week-day-input').forEach(cb => {
                cb.checked = med.selectedWeekDays ? med.selectedWeekDays.includes(cb.value) : false;
            });
            document.getElementById('weeklySingleDose').value = med.weeklySingleDose || 1;
        } else {
            document.querySelector('input[name="freqType"][value="daily"]').checked = true;
            toggleFreqMode('daily');
            document.getElementById('doseMorning').value = med.doses ? med.doses.m : 0;
            document.getElementById('doseNoon').value = med.doses ? med.doses.n : 0;
            document.getElementById('doseNight').value = med.doses ? med.doses.nt : 0;

            if (med.hasDoseChange) {
                document.getElementById('hasDoseChange').checked = true;
                toggleDoseChangeBox();
                document.getElementById('nextDoseMorning').value = med.nextDoses ? med.nextDoses.m : 0;
                document.getElementById('nextDoseNoon').value = med.nextDoses ? med.nextDoses.n : 0;
                document.getElementById('nextDoseNight').value = med.nextDoses ? med.nextDoses.nt : 0;
            } else {
                document.getElementById('hasDoseChange').checked = false;
                toggleDoseChangeBox();
            }
        }

        document.getElementById('currentStock').value = liveStock;
        document.getElementById('startDateSelect').value = med.startDate;

        const durationModeInput = document.getElementById('durationMode');
        const customDaysBox = document.getElementById('customDaysBox');
        const targetDaysInput = document.getElementById('targetDays');

        if (med.isContinuous) {
            durationModeInput.value = "continuous";
            customDaysBox.style.display = "none";
        } else if ([30, 60, 90].includes(med.targetDays)) {
            durationModeInput.value = med.targetDays;
            customDaysBox.style.display = "none";
        } else {
            durationModeInput.value = "custom";
            customDaysBox.style.display = "block";
            targetDaysInput.value = med.targetDays;
        }

        document.getElementById('note').value = med.note || '';
        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-pen"></i> আপডেট করুন';
        document.getElementById('cancelEditBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleLowStockFilter() {
        filterLowStock = !filterLowStock;
        document.getElementById('lowStockFilterBtn').classList.toggle('active', filterLowStock);
        renderMedicines();
    }

    /* Shopping List */
    function openShoppingModal() {
        document.getElementById('shoppingModal').style.display = 'flex';
        renderShoppingList();
    }

    function closeShoppingModal() {
        document.getElementById('shoppingModal').style.display = 'none';
    }

    function renderShoppingList() {
        const period = document.getElementById('shoppingPeriodSelect').value;
        const container = document.getElementById('shoppingListTableContainer');
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];

        let targetDaysForPeriod = 0;
        const lastDayOfCurrMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        const daysRemainingInCurrMonth = lastDayOfCurrMonth - today.getDate() + 1;

        if (period === 'currentMonth') {
            targetDaysForPeriod = daysRemainingInCurrMonth;
        } else if (period === 'next1Month') {
            const nextMonthDays = new Date(today.getFullYear(), today.getMonth() + 2, 0).getDate();
            targetDaysForPeriod = daysRemainingInCurrMonth + nextMonthDays;
        } else if (period === 'next2Months') {
            const next1MonthDays = new Date(today.getFullYear(), today.getMonth() + 2, 0).getDate();
            const next2MonthDays = new Date(today.getFullYear(), today.getMonth() + 3, 0).getDate();
            targetDaysForPeriod = daysRemainingInCurrMonth + next1MonthDays + next2MonthDays;
        }

        const activeMeds = appData.medicines.filter(m => isMedicineRunning(m));

        let html = `
            <table class="shopping-table">
                <thead>
                    <tr>
                        <th>ওষুধের নাম</th>
                        <th>বর্তমান স্টক</th>
                        <th>নির্ধারিত সময়ের সেবন</th>
                        <th>কিনতে হবে</th>
                    </tr>
                </thead>
                <tbody>
        `;

        activeMeds.forEach(med => {
            const { liveStock } = calculateLiveStock(med);
            let activeDaysInPeriod = targetDaysForPeriod;

            if (!med.isContinuous) {
                const endDateStr = addDays(med.startDate, med.targetDays);
                const endDateObj = new Date(endDateStr);
                const remainingCourseDays = Math.max(0, Math.ceil((endDateObj - today) / (1000 * 60 * 60 * 24)));
                activeDaysInPeriod = Math.min(targetDaysForPeriod, remainingCourseDays);
            }

            const neededTotal = Math.ceil(getRequiredForPeriod(med, todayStr, activeDaysInPeriod));
            const buyQty = Math.max(0, neededTotal - liveStock);

            html += `
                <tr>
                    <td><strong>${escapeHtml(med.name)}</strong></td>
                    <td>${toBengaliNumeral(liveStock)} টি</td>
                    <td>${toBengaliNumeral(neededTotal)} টি ${activeDaysInPeriod < targetDaysForPeriod ? '(কোর্স অনুযায়ী)' : ''}</td>
                    <td style="color:${buyQty > 0 ? 'var(--danger-color)' : 'var(--success-color)'}; font-weight:700;">
                        ${buyQty > 0 ? toBengaliNumeral(Math.ceil(buyQty)) + ' টি' : 'প্রয়োজন নেই'}
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = activeMeds.length === 0
            ? '<div style="text-align:center; padding:20px; color:var(--text-muted);">কোনো চলমান ওষুধ পাওয়া যায়নি।</div>'
            : html;
    }

    searchInput.addEventListener('input', renderMedicines);

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<"']/g, m => ({ '&': '&amp;', '<': '&lt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // Boot
    setInterval(renderMedicines, 60000);
    renderVisits();
    renderMedicines();
    initCloudSync();
</script>

</body>
</html>
